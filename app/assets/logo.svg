<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1829"/>
      <stop offset="55%" stop-color="#080E1A"/>
      <stop offset="100%" stop-color="#061621"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="30%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMint" cx="75%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cyanGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="mintGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="slashBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="neonBloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad1)" stroke="url(#rimGrad)" stroke-width="5"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#glowCyan)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#glowMint)"/>

  <!-- Inner Frosted Glass Pane -->
  <rect x="52" y="52" width="408" height="408" rx="84" fill="#101D33" fill-opacity="0.55" stroke="#7DD3FC" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Screen Viewfinder Corner Brackets -->
  <g fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M 92 146 L 92 108 Q 92 92 108 92 L 146 92" stroke="url(#cyanGlass)"/>
    <path d="M 366 92 L 404 92 Q 420 92 420 108 L 420 146" stroke="url(#cyanGlass)"/>
    <path d="M 92 366 L 92 404 Q 92 420 108 420 L 146 420" stroke="url(#mintGlass)"/>
    <path d="M 366 420 L 404 420 Q 420 420 420 404 L 420 366" stroke="url(#mintGlass)"/>
  </g>

  <!-- Left Glyph: 'A' (Latin) -->
  <g filter="url(#neonBloom)">
    <path d="M 178 148 L 118 308 L 148 308 L 161 270 L 207 270 L 220 308 L 250 308 L 190 148 Z M 169 244 L 184 198 L 199 244 Z" fill="url(#cyanGlass)"/>
  </g>

  <!-- Right Glyph: '文' (CJK Language/Text) -->
  <g filter="url(#neonBloom)">
    <path d="M 332 204 L 332 224 M 268 232 L 396 232 M 368 232 C 356 286, 322 332, 272 362 M 294 252 C 318 294, 352 334, 398 362" fill="none" stroke="url(#mintGlass)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Diagonal Laser Slash Divider -->
  <g filter="url(#neonBloom)">
    <line x1="168" y1="382" x2="344" y2="130" stroke="url(#slashBeam)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="7" fill="#FFFFFF"/>
  </g>
</svg>